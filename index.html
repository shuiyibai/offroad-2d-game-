<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>荒原越野 · Safari版</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#161915;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;left:max(12px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));z-index:5;color:#fff;text-shadow:0 2px 4px #000;font-weight:700;line-height:1.35;font-size:14px;pointer-events:none}
#hud .bar{width:150px;height:8px;background:#241d18;border:1px solid #ffffff66;border-radius:5px;overflow:hidden;margin-top:4px}
#hud .fill{height:100%;background:#d6a34c;width:100%}
#tip{position:fixed;right:max(12px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));z-index:5;color:#fff;text-shadow:0 2px 4px #000;font-size:12px;text-align:right;pointer-events:none}
#msg{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;pointer-events:none}
.card{background:#111a18dd;border:1px solid #ffffff40;border-radius:16px;padding:22px 28px;box-shadow:0 12px 45px #0008}
#touch{position:fixed;inset:0;z-index:20;pointer-events:none}
.btn{position:absolute;pointer-events:auto;border:1px solid #ffffff44;background:#111613b8;color:#fff;border-radius:18px;font-size:24px;font-weight:800;width:78px;height:64px;box-shadow:0 5px 18px #0005;touch-action:none;-webkit-appearance:none}
#brake{left:max(16px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom))}
#gas{right:max(16px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom))}
#tiltL{right:106px;bottom:max(18px,env(safe-area-inset-bottom));width:60px}
#tiltR{right:174px;bottom:max(18px,env(safe-area-inset-bottom));width:60px}
#fire{right:max(16px,env(safe-area-inset-right));bottom:max(94px,calc(env(safe-area-inset-bottom) + 76px));width:82px;height:54px;font-size:19px}
@media(min-width:900px){.btn{opacity:.35}.btn:hover{opacity:.9}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"></div>
<div id="tip">Safari / iPhone XS Max 优化<br>▶ 加速　◀ 刹车　↺↻ 空中平衡　炮击</div>
<div id="msg"></div>
<div id="touch">
<button class="btn" id="brake">◀</button>
<button class="btn" id="gas">▶</button>
<button class="btn" id="tiltL">↺</button>
<button class="btn" id="tiltR">↻</button>
<button class="btn" id="fire">炮击</button>
</div>
<script>
"use strict";
const c=document.getElementById("game"),ctx=c.getContext("2d",{alpha:false});
let W=390,H=844,DPR=1;
function resize(){
 DPR=Math.min(window.devicePixelRatio||1,2);
 W=document.documentElement.clientWidth||innerWidth||390;
 H=document.documentElement.clientHeight||innerHeight||844;
 c.width=W*DPR;c.height=H*DPR;c.style.width=W+"px";c.style.height=H+"px";
 ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize,false);resize();

const key={gas:false,brake:false,left:false,right:false,fire:false};
function bind(id,k){
 const b=document.getElementById(id);
 const on=e=>{e.preventDefault();key[k]=true};
 const off=e=>{e.preventDefault();key[k]=false};
 b.addEventListener("touchstart",on,{passive:false});b.addEventListener("touchend",off,{passive:false});b.addEventListener("touchcancel",off,{passive:false});
 b.addEventListener("mousedown",()=>key[k]=true);b.addEventListener("mouseup",()=>key[k]=false);b.addEventListener("mouseleave",()=>key[k]=false);
}
bind("gas","gas");bind("brake","brake");bind("tiltL","left");bind("tiltR","right");bind("fire","fire");
addEventListener("keydown",e=>{
 const k=e.key;
 if(["ArrowRight","d","D","w","W"].includes(k))key.gas=true;
 if(["ArrowLeft","a","A","s","S"].includes(k))key.brake=true;
 if(["ArrowUp","q","Q"].includes(k))key.left=true;
 if(["ArrowDown","e","E"].includes(k))key.right=true;
 if([" ","f","F"].includes(k))key.fire=true;
 if(k==="r"||k==="R")reset();
});
addEventListener("keyup",e=>{
 const k=e.key;
 if(["ArrowRight","d","D","w","W"].includes(k))key.gas=false;
 if(["ArrowLeft","a","A","s","S"].includes(k))key.brake=false;
 if(["ArrowUp","q","Q"].includes(k))key.left=false;
 if(["ArrowDown","e","E"].includes(k))key.right=false;
 if([" ","f","F"].includes(k))key.fire=false;
});

const objects=[],coins=[],particles=[],shots=[],dust=[];
let camera=0,shake=0,score=0,gameOver=false,win=false,lastShot=0;
const levelEnd=11200;

function groundY(x){
 let y=H*.70;
 y+=Math.sin(x*.0027)*34+Math.sin(x*.0088+1.2)*18+Math.sin(x*.018)*7;
 const hills=[[900,35,1],[1450,-75,1],[2050,120,1.1],[2750,-105,1.2],[3500,155,1.1],[4300,-185,1.35],[5100,110,1.1],[5900,-150,1.3],[6800,210,1.2],[7700,-190,1.25],[8700,130,1.1],[9600,-240,1.35],[10400,170,1.1]];
 for(const [cx,a,s] of hills)y+=a*Math.exp(-Math.pow((x-cx)/(190*s),2));
 return y;
}
function slope(x){return (groundY(x+3)-groundY(x-3))/6}

const car={x:190,y:0,vx:0,vy:0,angle:0,angv:0,hp:100,w:118,h:44,ground:false,air:0,bounce:0,shotHeat:0};
function addParticle(x,y,n,type){
 for(let i=0;i<n;i++){
  const a=Math.random()*Math.PI*2,sp=(type==="smoke"?25:45)+Math.random()*210;
  particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(type==="fire"?100:60),life:.45+Math.random()*.8,max:1,size:2+Math.random()*7,type});
 }
}
function addDust(x,y,n){
 for(let i=0;i<n;i++)dust.push({x:x+(Math.random()-.5)*20,y:y+(Math.random()-.5)*4,vx:-30-Math.random()*90,vy:-15-Math.random()*35,life:.35+Math.random()*.35,max:.7,size:2+Math.random()*5});
}
function reset(){
 objects.length=0;coins.length=0;particles.length=0;shots.length=0;dust.length=0;
 score=0;camera=0;shake=0;gameOver=false;win=false;
 Object.assign(car,{x:190,y:groundY(190)-70,vx:0,vy:0,angle:0,angv:0,hp:100,ground:false,air:0,bounce:0,shotHeat:0});
 buildLevel();
}
function addObj(o){objects.push(Object.assign({dead:false,hit:0},o))}
function buildLevel(){
 // Early gentle section
 for(let x=520;x<10200;){
  x+=260+Math.random()*260;
  const gy=groundY(x);
  const r=Math.random();
  if(r<.48)addObj({type:"crate",x,y:gy-28,w:58,h:56,hp:24,mass:1});
  else if(r<.70)addObj({type:"frame",x,y:gy-48,w:98,h:92,hp:58,mass:2});
  else if(r<.82)addObj({type:"barrel",x,y:gy-34,w:34,h:60,hp:1});
  else addObj({type:"ramp",x,y:gy-16,w:135,h:32,hp:999});
  if(Math.random()<.75)coins.push({x:x+55,y:groundY(x+55)-75-random(0,25),r:10,got:false});
 }
 // Deliberate wooden bridges
 for(const x of [1780,3780,5480,7480,9180]){
  const y=groundY(x)-18;
  addObj({type:"bridge",x,y,w:330,h:28,hp:80,mass:4,bridge:true});
  addObj({type:"bridgePost",x:x-145,y:y-55,w:18,h:110,hp:45});
  addObj({type:"bridgePost",x:x+145,y:y-55,w:18,h:110,hp:45});
 }
 // More dangerous late section
 for(const x of [2350,3250,4550,6350,8050,9750,10600]){
  addObj({type:"barrel",x,y:groundY(x)-34,w:34,h:60,hp:1});
 }
 addObj({type:"finish",x:levelEnd-250,y:groundY(levelEnd-250)-110,w:20,h:110,hp:999});
 for(let x=850;x<levelEnd-400;x+=540+Math.random()*360) coins.push({x,y:groundY(x)-100-random(0,25),r:10,got:false});
}
function random(a,b){return a+Math.random()*(b-a)}

function destroy(o,byShot=false){
 if(o.dead)return;
 o.dead=true;
 if(o.type==="barrel"){
  addParticle(o.x,o.y-o.h/2,36,"fire");addParticle(o.x,o.y-o.h/2,25,"smoke");shake=byShot?6:18;
  if(!byShot){car.hp-=32;car.vy-=280;car.vx+=o.x<car.x?110:-110;car.angv+=(Math.random()-.5)*6}
 }else{
  addParticle(o.x,o.y-o.h/2,18,"wood");
  if(!byShot)car.hp-=o.type==="frame"?8:3;
 }
}
function fireShot(){
 if(performance.now()-lastShot<135)return;
 lastShot=performance.now();
 shots.push({x:car.x+car.w*.55,y:car.y-6,vx:720,life:1.25});
 addParticle(car.x+car.w*.55,car.y-6,5,"fire");
}

function update(dt){
 if(gameOver||win)return;
 if(key.fire)fireShot();

 const throttle=key.gas?1:0;
 const brake=key.brake?1:0;
 const maxSpeed=430;
 const target=throttle?maxSpeed:0;
 car.vx+=(target-car.vx)*dt*(throttle?1.75:.12);
 if(brake)car.vx-=360*dt;
 car.vx*=Math.pow(.994,dt*60);
 car.vx=Math.max(-100,Math.min(maxSpeed,car.vx));

 const gy=groundY(car.x), wheelY=car.y+car.h*.55;
 car.ground=wheelY>=gy-5;
 if(car.ground){
  const wasAir=car.air;
  car.y=gy-car.h*.55;
  const targetA=Math.atan2(groundY(car.x+52)-groundY(car.x-52),104);
  car.angle+=(targetA-car.angle)*dt*10;
  if(wasAir>.18){
   const impact=Math.abs(car.vy);
   if(impact>240){car.hp-=Math.min(22,(impact-220)*.035);shake=Math.min(9,impact*.018);car.bounce=1}
  }
  car.vy=Math.min(car.vy,0);car.air=0;
  if(Math.abs(car.vx)>90)addDust(car.x-25,gy-3,2);
 }else{
  car.vy+=820*dt;car.y+=car.vy*dt;car.air+=dt;
  const tilt=(key.right?1:0)-(key.left?1:0);
  car.angv+=tilt*8.5*dt;
  car.angv*=Math.pow(.95,dt*60);
  car.angle+=car.angv*dt;
 }
 // Ramps give deliberate airtime
 for(const o of objects){
  if(o.dead||o.type!=="ramp")continue;
  if(Math.abs(o.x-car.x)<o.w*.48 && car.ground && car.vx>150){
   car.vy=-Math.min(540,260+car.vx*.72);car.ground=false;car.air=.01;
  }
 }
 car.x+=car.vx*dt;

 // Vehicle-object collision
 for(const o of objects){
  if(o.dead||o.type==="finish"||o.type==="ramp")continue;
  if(Math.abs(o.x-car.x)<(o.w+car.w)*.5 && Math.abs((o.y-o.h*.5)-car.y)<(o.h+car.h)*.5){
   if(o.type==="barrel")destroy(o,false); else if(o.type!=="bridgePost")destroy(o,false);
  }
 }
 // Shots destroy wood and barrels before the car reaches them
 for(const s of shots){
  s.x+=s.vx*dt;s.life-=dt;
  for(const o of objects){
   if(o.dead||o.type==="finish"||o.type==="ramp"||o.type==="bridgePost")continue;
   if(Math.abs(s.x-o.x)<o.w*.65 && Math.abs(s.y-(o.y-o.h*.5))<o.h*.65){
    destroy(o,true);s.life=0;addParticle(s.x,s.y,7,"wood");break;
   }
  }
 }
 for(let i=shots.length-1;i>=0;i--)if(shots[i].life<=0)shots.splice(i,1);

 for(const co of coins)if(!co.got&&Math.hypot(co.x-car.x,co.y-car.y)<58){co.got=true;score++}

 if(car.x>levelEnd-280)win=true;
 if(car.hp<=0){car.hp=0;gameOver=true}

 camera+=(car.x-W*.30-camera)*dt*(2.6+Math.min(2.4,Math.abs(car.vx)/180));
 camera=Math.max(0,camera);
 if(shake>0)shake*=Math.pow(.055,dt);else shake=0;

 for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=540*dt;p.life-=dt}
 for(const p of dust){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=80*dt;p.life-=dt}
 for(let i=particles.length-1;i>=0;i--)if(particles[i].life<=0)particles.splice(i,1);
 for(let i=dust.length-1;i>=0;i--)if(dust[i].life<=0)dust.splice(i,1);
}

function drawSky(){
 const g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,"#566967");g.addColorStop(.48,"#9a9b82");g.addColorStop(1,"#c4a779");
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // sun haze
 const rg=ctx.createRadialGradient(W*.72,H*.22,10,W*.72,H*.22,170);
 rg.addColorStop(0,"#eee0ad66");rg.addColorStop(1,"#eee0ad00");ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
 // layered mountains
 for(let layer=0;layer<3;layer++){
  ctx.beginPath();ctx.moveTo(0,H*.60);
  for(let x=0;x<=W+80;x+=70){
   const wx=x+camera*(.12+layer*.10);
   ctx.lineTo(x,H*(.56+layer*.035)+Math.sin(wx*.0025+layer)*32+Math.sin(wx*.006)*12);
  }
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();
  ctx.fillStyle=["#53615c","#5d6256","#6c6758"][layer];ctx.fill();
 }
}
function drawGround(){
 ctx.beginPath();ctx.moveTo(0,H);
 for(let x=0;x<=W+20;x+=10)ctx.lineTo(x,groundY(x+camera));
 ctx.lineTo(W,H);ctx.closePath();ctx.fillStyle="#6b5640";ctx.fill();
 ctx.strokeStyle="#382f27";ctx.lineWidth=3;ctx.beginPath();
 for(let x=0;x<=W+20;x+=10)ctx.lineTo(x,groundY(x+camera));ctx.stroke();
 // dirt strata
 ctx.globalAlpha=.18;ctx.strokeStyle="#c19b69";ctx.lineWidth=2;
 for(let k=0;k<7;k++){ctx.beginPath();for(let x=0;x<=W+20;x+=30)ctx.lineTo(x,groundY(x+camera)+30+k*20+Math.sin(x*.03+k)*5);ctx.stroke()}
 ctx.globalAlpha=1;
 // grass
 for(let wx=Math.floor(camera/55)*55;wx<camera+W+60;wx+=55){
  const x=wx-camera,y=groundY(wx);ctx.strokeStyle="#526149";ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-4,y-10);ctx.moveTo(x,y);ctx.lineTo(x+4,y-8);ctx.stroke();
 }
}
function drawObject(o){
 if(o.dead)return;
 const x=o.x-camera,y=o.y;
 ctx.save();
 if(o.type==="barrel"){
  ctx.translate(x,y-o.h*.5);ctx.fillStyle="#6f3028";ctx.fillRect(-o.w/2,-o.h/2,o.w,o.h);
  ctx.fillStyle="#aeb2a8";ctx.fillRect(-o.w/2,-o.h/2+8,o.w,7);ctx.fillRect(-o.w/2,o.h/2-15,o.w,7);
  ctx.fillStyle="#d04b3b";ctx.font="bold 16px sans-serif";ctx.textAlign="center";ctx.fillText("⚠",-1,5);
 }else if(o.type==="bridge"){
  ctx.translate(x,y);ctx.fillStyle="#765237";ctx.fillRect(-o.w/2,-o.h/2,o.w,o.h);
  for(let bx=-o.w/2+10;bx<o.w/2;bx+=30){ctx.fillStyle="#9b7048";ctx.fillRect(bx,-o.h/2,18,o.h)}
  ctx.strokeStyle="#3b2b1f";ctx.lineWidth=4;ctx.strokeRect(-o.w/2,-o.h/2,o.w,o.h);
  ctx.strokeStyle="#5a402c";ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-o.w/2,-14);ctx.lineTo(o.w/2,14);ctx.moveTo(-o.w/2,14);ctx.lineTo(o.w/2,-14);ctx.stroke();
 }else if(o.type==="bridgePost"){
  ctx.translate(x,y);ctx.fillStyle="#553d2b";ctx.fillRect(-o.w/2,-o.h/2,o.w,o.h);
 }else if(o.type==="ramp"){
  ctx.translate(x,y);ctx.fillStyle="#7b5637";ctx.beginPath();ctx.moveTo(-o.w/2,15);ctx.lineTo(o.w/2,15);ctx.lineTo(o.w/2,-8);ctx.closePath();ctx.fill();ctx.strokeStyle="#34271d";ctx.stroke();
 }else if(o.type==="finish"){
  ctx.translate(x,y);ctx.fillStyle="#d8d0b1";ctx.fillRect(-5,-o.h,10,o.h);
  ctx.fillStyle="#d5b449";ctx.fillRect(0,-o.h,85,38);
 }else{
  ctx.translate(x,y-o.h*.5);ctx.fillStyle=o.type==="crate"?"#815f3e":"#62462f";ctx.fillRect(-o.w/2,-o.h/2,o.w,o.h);
  ctx.strokeStyle="#34261c";ctx.lineWidth=3;ctx.strokeRect(-o.w/2,-o.h/2,o.w,o.h);
  ctx.strokeStyle="#a0784e";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-o.w/2+4,-o.h/2+4);ctx.lineTo(o.w/2-4,o.h/2-4);ctx.moveTo(o.w/2-4,-o.h/2+4);ctx.lineTo(-o.w/2+4,o.h/2-4);ctx.stroke();
 }
 ctx.restore();
}
function drawCar(){
 ctx.save();ctx.translate(car.x-camera,car.y);ctx.rotate(car.angle);
 // suspension shadows and chassis
 ctx.fillStyle="#111";ctx.fillRect(-56,-9,112,25);
 // body
 ctx.fillStyle="#39443f";ctx.beginPath();ctx.moveTo(-58,12);ctx.lineTo(-52,-20);ctx.lineTo(-24,-23);ctx.lineTo(-5,-42);ctx.lineTo(34,-38);ctx.lineTo(55,-17);ctx.lineTo(59,10);ctx.closePath();ctx.fill();
 ctx.strokeStyle="#171c1a";ctx.lineWidth=3;ctx.stroke();
 // windows
 ctx.fillStyle="#182727";ctx.beginPath();ctx.moveTo(-20,-24);ctx.lineTo(-4,-38);ctx.lineTo(13,-35);ctx.lineTo(15,-22);ctx.closePath();ctx.fill();
 ctx.beginPath();ctx.moveTo(19,-34);ctx.lineTo(33,-31);ctx.lineTo(47,-18);ctx.lineTo(19,-20);ctx.closePath();ctx.fill();
 // front bumper + game-only rapid-fire cannon
 ctx.fillStyle="#1b211f";ctx.fillRect(50,-3,18,11);
 ctx.fillStyle="#59625c";ctx.fillRect(60,-10,24,8);ctx.fillRect(60,0,24,8);
 // lights
 ctx.fillStyle="#d7c98e";ctx.fillRect(47,-18,8,7);
 // wheels
 for(const wx of [-38,39]){
  ctx.fillStyle="#121313";ctx.beginPath();ctx.arc(wx,19,18,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#8c918a";ctx.beginPath();ctx.arc(wx,19,7,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#3b403d";ctx.lineWidth=3;ctx.beginPath();ctx.arc(wx,19,12,0,Math.PI*2);ctx.stroke();
  // visible suspension
  ctx.strokeStyle="#b1a27a";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(wx,3);ctx.lineTo(wx,14);ctx.stroke();
 }
 ctx.restore();
}
function draw(){
 let sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;
 ctx.save();ctx.translate(sx,sy);drawSky();drawGround();
 for(const o of objects)drawObject(o);
 for(const co of coins){
  if(co.got)continue;const x=co.x-camera;
  ctx.fillStyle="#d6ad42";ctx.beginPath();ctx.arc(x,co.y,co.r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#fff1a2";ctx.lineWidth=2;ctx.stroke();
 }
 for(const s of shots){
  const x=s.x-camera;ctx.fillStyle="#ffd16a";ctx.fillRect(x-9,s.y-2,18,4);
  ctx.globalAlpha=.35;ctx.fillRect(x-25,s.y-1,18,2);ctx.globalAlpha=1;
 }
 for(const p of dust){ctx.globalAlpha=Math.max(0,p.life/p.max)*.45;ctx.fillStyle="#c2a982";ctx.beginPath();ctx.arc(p.x-camera,p.y,p.size,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
 for(const p of particles){
  ctx.globalAlpha=Math.max(0,p.life/p.max);
  ctx.fillStyle=p.type==="fire"?"#ef6932":p.type==="smoke"?"#554f49":"#9a7047";
  ctx.fillRect(p.x-camera,p.y,p.size,p.size);
  ctx.globalAlpha=1;
 }
 drawCar();
 ctx.restore();

 const kmh=Math.round(Math.abs(car.vx)*.31);
 document.getElementById("hud").innerHTML=
 `速度 ${kmh} km/h　金币 ${score}<br><div class="bar"><div class="fill" style="width:${car.hp}%"></div></div>耐久 ${Math.round(car.hp)}%`;
 if(gameOver)document.getElementById("msg").innerHTML='<div class="card"><b>车辆报废</b><br>按 R 重新开始</div>';
 else if(win)document.getElementById("msg").innerHTML='<div class="card"><b>关卡完成</b><br>金币：'+score+'<br>按 R 再来一次</div>';
 else document.getElementById("msg").innerHTML="";
}
let last=performance.now();
function loop(t){
 const dt=Math.min(.032,(t-last)/1000);last=t;
 update(dt);draw();requestAnimationFrame(loop);
}
reset();draw();requestAnimationFrame(loop);
</script>
</body>
</html>
