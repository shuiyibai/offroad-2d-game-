<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>荒原越野：物理驾驶原型</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#171914;font-family:system-ui,-apple-system,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%;background:#8e9b88}
#hud{position:fixed;left:12px;top:10px;color:#fff;text-shadow:0 2px 4px #000;z-index:3;font-size:14px;line-height:1.45}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;z-index:4;pointer-events:none}
.card{background:#111cddc9;padding:20px 25px;border:1px solid #ffffff55;border-radius:12px;max-width:420px}
#touch{position:fixed;inset:0;z-index:5;pointer-events:none} .btn{pointer-events:auto;touch-action:none;}
.btn{position:absolute;bottom:20px;width:86px;height:70px;border-radius:18px;background:#10130dcc;border:1px solid #ffffff55;color:#fff;font-size:25px;pointer-events:auto;user-select:none}
#brake{left:18px} #gas{right:18px} #tiltL{right:122px} #tiltR{right:224px}
.small{font-size:12px;opacity:.8}
@media(min-width:900px){.btn{opacity:.35}}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{-webkit-appearance:none;appearance:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div><div id="msg"></div>
<div id="err" style="display:none;position:fixed;left:10px;right:10px;top:10px;z-index:99;background:#2a1111;color:#fff;padding:14px;border-radius:10px;font:14px monospace;white-space:pre-wrap"></div>
<div id="touch">
<button class="btn" id="brake">◀</button>
<button class="btn" id="gas">▶</button>
<button class="btn" id="tiltL">↺</button>
<button class="btn" id="tiltR">↻</button>
</div>
<script>
const C=document.querySelector('#c'),ctx=C.getContext('2d');
const ERR=document.querySelector('#err');
window.onerror=function(message,source,line,col,error){
  ERR.style.display='block';
  ERR.textContent='游戏脚本错误：\\n'+message+'\\n第 '+line+' 行';
};
let W,H,DPR,scale=1;
function resize(){DPR=Math.min(window.devicePixelRatio || 1, 2); W=document.documentElement.clientWidth || window.innerWidth || 390; H=document.documentElement.clientHeight || window.innerHeight || 844;C.width=W*DPR;C.height=H*DPR;C.style.width=W+'px';C.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}
window.addEventListener('resize',resize,false); resize();

const keys={gas:false,brake:false,left:false,right:false};
addEventListener('keydown',e=>{
 if(['ArrowRight','d','D','w','W'].includes(e.key))keys.gas=true;
 if(['ArrowLeft','a','A','s','S'].includes(e.key))keys.brake=true;
 if(['ArrowUp','q','Q'].includes(e.key))keys.left=true;
 if(['ArrowDown','e','E'].includes(e.key))keys.right=true;
 if(e.key==='r')reset();
});
addEventListener('keyup',e=>{
 if(['ArrowRight','d','D','w','W'].includes(e.key))keys.gas=false;
 if(['ArrowLeft','a','A','s','S'].includes(e.key))keys.brake=false;
 if(['ArrowUp','q','Q'].includes(e.key))keys.left=false;
 if(['ArrowDown','e','E'].includes(e.key))keys.right=false;
});
function bind(id,k){
 const b=document.getElementById(id);
 b.ontouchstart=function(e){e.preventDefault();keys[k]=true;return false;};
 b.ontouchend=function(e){e.preventDefault();keys[k]=false;return false;};
 b.ontouchcancel=function(e){e.preventDefault();keys[k]=false;return false;};
 b.onmousedown=function(){keys[k]=true;};
 b.onmouseup=function(){keys[k]=false;};
 b.onmouseleave=function(){keys[k]=false;};
}
bind('gas','gas');
bind('brake','brake');
bind('tiltL','left');
bind('tiltR','right');

const terrain=[];
function groundY(x){
 let y=H*.70;
 y += Math.sin(x*.004)*42 + Math.sin(x*.011+1.7)*20 + Math.sin(x*.022)*9;
 const bumps=[
  [1250,170,1.2],[1800,-120,1.3],[2450,190,1.4],[3150,-160,1.2],
  [3900,140,1.1],[4650,-210,1.4],[5450,170,1.2],[6200,-190,1.3],
  [7000,130,1.2],[7900,-230,1.3]
 ];
 for(const [cx,a,s] of bumps)y+=a*Math.exp(-Math.pow((x-cx)/180/s,2));
 return y;
}
function slope(x){return (groundY(x+2)-groundY(x-2))/4}

let debris=[],objects=[],particles=[],coins=[],camera=0,shake=0,gameOver=false,win=false,score=0;
function makeLevel(){
 objects=[];coins=[];debris=[];particles=[];
 for(let x=500;x<8200;x+=420+Math.random()*320){
  let gy=groundY(x);
  let type=Math.random()<.72?'crate':'frame';
  objects.push({x,y:gy-28,w:type==='crate'?55:90,h:type==='crate'?55:70,type,hp:type==='crate'?25:55,mass:type==='crate'?1:2,dead:false});
  if(Math.random()<.75) coins.push({x:x+100,y:gy-95,r:10,got:false});
  if(Math.random()<.35) objects.push({x:x+170,y:groundY(x+170)-35,w:32,h:55,type:'barrel',hp:1,dead:false});
 }
 for(let x=900;x<8000;x+=650+Math.random()*400)coins.push({x,y:groundY(x)-100,r:10,got:false});
 objects.push({x:8250,y:groundY(8250)-30,w:50,h:60,type:'finish',hp:999,dead:false});
}
const car={x:180,y:0,vx:0,vy:0,angle:0,angv:0,w:108,h:42,hp:100,fuel:100,ground:false,airTime:0};
function reset(){
 Object.assign(car,{x:180,y:groundY(180)-65,vx:0,vy:0,angle:0,angv:0,hp:100,ground:false,airTime:0});
 camera=0; gameOver=false; win=false; score=0;
 makeLevel(); show('');
}
function show(t){document.querySelector('#msg').innerHTML=t?'<div class="card">'+t+'</div>':''}
reset();
draw();


function spawn(x,y,n,kind='wood'){
 for(let i=0;i<n;i++){
  let a=Math.random()*Math.PI*2,sp=40+Math.random()*190;
  particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-80,life:.5+Math.random()*.7,max:1,size:kind==='fire'?4+Math.random()*8:3+Math.random()*6,kind});
 }
}
function explode(o){
 if(o.dead)return;o.dead=true;
 spawn(o.x,o.y,42,'fire');spawn(o.x,o.y,28,'smoke');shake=18;
 car.hp-=35;car.vx+=o.x<car.x?90:-90;car.vy-=260;car.angv+=(Math.random()-.5)*7;
}
function breakObj(o){
 if(o.dead)return;o.dead=true;spawn(o.x,o.y,20,'wood');
 car.vx+=35*(o.x<car.x?1:-1);car.hp-=o.type==='frame'?8:3;
}
function update(dt){
 if(gameOver||win)return;
 const gas=keys.gas, brake=keys.brake;
 let frontSlope=slope(car.x+40), backSlope=slope(car.x-40);
 const target=gas?230:0;
 car.vx += (target-car.vx)*dt*(gas?1.25:.22);
 if(brake)car.vx-=250*dt;
 car.vx*=Math.pow(.992,dt*60);
 car.vx=Math.max(-70,Math.min(330,car.vx));
 const gy=groundY(car.x);
 const wheelY=car.y+car.h*.55;
 car.ground=wheelY>=gy-3;
 if(car.ground){
  car.y=gy-car.h*.55;
  const targetAngle=Math.atan2(groundY(car.x+50)-groundY(car.x-50),100);
  car.angle += (targetAngle-car.angle)*dt*8;
  car.vy=Math.min(car.vy,0);
  car.airTime=0;
 }else{
  car.vy+=720*dt;car.y+=car.vy*dt;car.airTime+=dt;
  let tilt=(keys.right?1:0)-(keys.left?1:0);
  car.angv+=tilt*7*dt;car.angv*=Math.pow(.93,dt*60);car.angle+=car.angv*dt;
 }
 car.x+=car.vx*dt;
 // simple collision checks
 for(const o of objects){
  if(o.dead)continue;
  let dx=Math.abs(o.x-car.x), dy=Math.abs((o.y-o.h/2)-(car.y));
  if(dx<(o.w+car.w)/2 && dy<(o.h+car.h)/2){
   if(o.type==='barrel')explode(o); else if(o.type!=='finish')breakObj(o);
  }
 }
 for(const co of coins){
  if(!co.got&&Math.hypot(co.x-car.x,co.y-car.y)<55){co.got=true;score++;}
 }
 if(car.x>8240)win=true;
 if(car.hp<=0){car.hp=0;gameOver=true}
 camera += ((car.x-W*.32)-camera)*dt*(2.5+Math.min(2,Math.abs(car.vx)/180));
 camera=Math.max(0,camera);
 if(shake>0)shake*=Math.pow(.06,dt); else shake=0;
 for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;p.life-=dt}
 particles=particles.filter(p=>p.life>0);
}
function draw(){
 ctx.clearRect(0,0,W,H);
 let sx=(Math.random()-.5)*shake, sy=(Math.random()-.5)*shake;
 ctx.save();ctx.translate(sx,sy);
 // sky gradient
 let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#71817b');g.addColorStop(.55,'#a7aa8d');g.addColorStop(1,'#5e513f');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // distant hills
 ctx.fillStyle='#59675f';ctx.beginPath();ctx.moveTo(0,H*.63);
 for(let x=0;x<W+80;x+=80)ctx.lineTo(x,H*.57+Math.sin((x+camera)*.003)*35);
 ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
 // ground
 ctx.beginPath();ctx.moveTo(0,H);
 for(let x=0;x<=W+20;x+=12){let wx=x+camera;ctx.lineTo(x,groundY(wx))}
 ctx.lineTo(W,H);ctx.closePath();ctx.fillStyle='#705a43';ctx.fill();
 ctx.strokeStyle='#3e372c';ctx.lineWidth=3;ctx.beginPath();
 for(let x=0;x<=W+20;x+=12){let wx=x+camera;ctx.lineTo(x,groundY(wx))}
 ctx.stroke();
 // grass tufts
 ctx.strokeStyle='#52624a';ctx.lineWidth=2;
 for(let x=Math.floor(camera/70)*70;x<camera+W+70;x+=70){let y=groundY(x);ctx.beginPath();ctx.moveTo(x-camera,y);ctx.lineTo(x-camera-3,y-10);ctx.moveTo(x-camera,y);ctx.lineTo(x-camera+4,y-8);ctx.stroke()}
 // objects
 for(const o of objects){if(o.dead)continue;let x=o.x-camera,y=o.y;
  if(o.type==='barrel'){ctx.fillStyle='#8d3328';ctx.fillRect(x-o.w/2,y-o.h,o.w,o.h);ctx.fillStyle='#bbb';ctx.fillRect(x-o.w/2,y-o.h+8,o.w,7);ctx.fillRect(x-o.w/2,y-22,o.w,7)}
  else if(o.type==='finish'){ctx.fillStyle='#d8d0b1';ctx.fillRect(x-5,y-110,10,110);ctx.fillStyle='#e8e2cf';ctx.fillRect(x-5,y-110,75,42)}
  else{ctx.save();ctx.translate(x,y-o.h/2);ctx.rotate((o.x*.01)%0.08);ctx.fillStyle=o.type==='crate'?'#80603e':'#694a31';ctx.fillRect(-o.w/2,-o.h/2,o.w,o.h);ctx.strokeStyle='#30251c';ctx.lineWidth=3;ctx.strokeRect(-o.w/2,-o.h/2,o.w,o.h);ctx.beginPath();ctx.moveTo(-o.w/2,-o.h/2);ctx.lineTo(o.w/2,o.h/2);ctx.moveTo(o.w/2,-o.h/2);ctx.lineTo(-o.w/2,o.h/2);ctx.stroke();ctx.restore()}
 }
 for(const co of coins){if(co.got)continue;let x=co.x-camera;ctx.strokeStyle='#d9bd49';ctx.lineWidth=4;ctx.beginPath();ctx.arc(x,co.y,co.r,0,Math.PI*2);ctx.stroke()}
 // car
 ctx.save();ctx.translate(car.x-camera,car.y);ctx.rotate(car.angle);
 ctx.fillStyle='#262a29';ctx.fillRect(-car.w/2,-car.h/2,car.w,car.h);
 ctx.fillStyle='#707872';ctx.beginPath();ctx.moveTo(-25,-21);ctx.lineTo(5,-38);ctx.lineTo(36,-34);ctx.lineTo(48,-18);ctx.closePath();ctx.fill();
 ctx.fillStyle='#26302f';ctx.fillRect(4,-34,22,13);ctx.fillRect(-18,-31,18,13);
 ctx.fillStyle='#151515';ctx.beginPath();ctx.arc(-35,24,15,0,Math.PI*2);ctx.arc(35,24,15,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#aaa';ctx.beginPath();ctx.arc(-35,24,6,0,Math.PI*2);ctx.arc(35,24,6,0,Math.PI*2);ctx.fill();
 ctx.restore();
 // particles
 for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.kind==='fire'?'#e85c2e':p.kind==='smoke'?'#554d45':'#9a7047';ctx.fillRect(p.x-camera,p.y,p.size,p.size);ctx.globalAlpha=1}
 ctx.restore();
 let speed=Math.round(Math.abs(car.vx)*.35);
 document.querySelector('#hud').innerHTML=`iPhone XS Max 模式　速度 ${speed} km/h　耐久 ${Math.round(car.hp)}%　金币 ${score}<br><span class="small">PC：W/D/→ 油门　A/S/← 刹车　Q/E 或 ↑/↓ 空中倾斜　R 重置</span>`;
 if(gameOver)show('<b>车辆报废</b><br>按 R 或点击画面重来');
 if(win)show('<b>关卡完成</b><br>收集金币：'+score+'<br>按 R 再来一次');
}
let last=performance.now();
function loop(t){let dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}

requestAnimationFrame(loop);
</script>
</body></html>
